<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matt Monihan Promo</title>
<style>
@font-face{font-family:'Bebas';src:url(assets/fonts/bebas-neue-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Mono';font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Mono';font-weight:800;src:url(assets/fonts/jetbrains-mono-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:900;src:url(assets/fonts/inter-latin-900-normal.woff2) format('woff2')}

html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000}
.layer{position:absolute;inset:0;pointer-events:none}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.push{position:absolute;inset:0;transform-origin:30% 50%}
.bg{position:absolute;inset:0}
.col{position:absolute;display:flex;flex-direction:column;align-items:flex-start}
.mask{overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.in{display:block;will-change:transform}
.h1,.h2{font-family:'Bebas';line-height:.9;white-space:nowrap;letter-spacing:.005em}
.h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.h1 .w > span{display:inline-block}
.sub{font-family:'Inter';font-weight:600;letter-spacing:-.01em;line-height:1.25}
.label{font-family:'Mono';font-weight:800;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;display:flex;align-items:center}
.label .bar{display:inline-block;height:.28em;margin-right:.8em}
.tag{font-family:'Mono';font-weight:500;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.stamp{font-family:'Mono';font-weight:800;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;display:inline-block;line-height:1}
.item{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.strike{position:absolute;left:-2%;top:46%;height:.09em;width:0}
.photo{position:absolute;inset:0;overflow:hidden}
.photo img{position:absolute;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.45) brightness(1.4)}
.photo .tint{position:absolute;inset:0;mix-blend-mode:multiply}
.photo .dots{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.45}
.shot{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.shot img{display:block;width:100%}
#flash,#fade{position:absolute;inset:0;opacity:0}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.08;background-repeat:repeat}
#url{position:absolute;font-family:'Mono';font-weight:800;letter-spacing:.08em;white-space:nowrap}
#prog{position:absolute;left:0;bottom:0;width:0}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes" class="layer"></div>
  <div id="grain" class="layer"></div>
  <div id="url"></div>
  <div id="prog"></div>
  <div id="flash" class="layer"></div>
  <div id="fade" class="layer" style="background:#000"></div>
</div>
<script>
// ---------- timing: locked to the song grid (110.06 BPM) ----------
const P = 0.54518;          // seconds per beat
const NB = 43;              // 4 pickup beats, 32 drop beats, 7 end beats (ends where the song's bass cuts out)
const DUR = NB * P;         // 23.443 s

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1080;
const U = Math.min(W, H) / 100;          // 1u = 1% of the short side
const PORTRAIT = H > W * 1.2, WIDE = W > H * 1.2;
const PAD = (WIDE ? 9 : 8) * U;           // left margin of the text column

const C = {black:'#000000', white:'#FFFFFF', blue:'#2E5CFF', red:'#FD1528', navy:'#0A141C'};
const TH = {
  black:{bg:C.black, fg:C.white, ac:C.blue, dim:'rgba(255,255,255,.45)'},
  blue: {bg:C.blue,  fg:C.white, ac:C.black, dim:'rgba(255,255,255,.55)'},
  white:{bg:C.white, fg:C.black, ac:C.red,  dim:'rgba(0,0,0,.4)'},
  navy: {bg:C.navy,  fg:C.white, ac:C.red,  dim:'rgba(255,255,255,.45)'},
};

// ---------- the story ----------
// Each scene starts on beat k and lasts n beats. Elements appear at `at` beats into the scene and stay.
// trans: 'cut' (hard cut on the beat) or 'wipe' (new chapter slides in from the right).
// kinds: label, h1 (big), h2 (medium), sub (sentence), item (list row), stamp, words (h1 revealed word by word).
const SCENES = [
  // The hook, over the breakdown
  {k:0, n:4, th:'black', trans:'cut', fadeOut:0.18, els:[
    {at:0, kind:'h1', t:'COPY.', sz:19},
    {at:1, kind:'h1', t:'PASTE.', sz:19},
    {at:2, kind:'h1', t:'RETYPE.', sz:19},
    {at:3, kind:'h1', t:'REPEAT.', sz:19, c:'#FD1528'},
  ]},
  // The drop: who this is
  {k:4, n:4, th:'black', trans:'cut', flash:C.blue, place:'bottom', photo:{zoom:[1.14,1.04]}, els:[
    {at:0, kind:'h1', t:'MATT', sz:17},
    {at:0.5, kind:'h1', t:'MONIHAN', sz:17},
    {at:1.5, kind:'sub', t:'I build tools that kill grunt work.'},
  ]},
  // Chapter 01
  {k:8, n:4, th:'black', trans:'wipe', shot:{src:'rj', rot:-5, op:.2}, els:[
    {at:0, kind:'label', t:'01  Where I started'},
    {at:0, kind:'h1', t:'EMPLOYEE #10'},
    {at:0.5, kind:'h1', t:'AT RJMETRICS', c:'ac'},
    {at:2, kind:'sub', t:'Philadelphia, 2011.'},
  ]},
  {k:12, n:4, th:'black', trans:'cut', shot:{src:'rj', rot:-5, op:.2, cont:true}, els:[
    {at:0, kind:'label', t:'01  Where I started', keep:true},
    {at:0, kind:'sub', t:'I led the report builder overhaul.'},
    {at:0.5, kind:'h2', t:'1 HOUR PER ANALYSIS', strike:1.1, dim:true, gap:3},
    {at:1.25, kind:'h1', t:'UNDER 5 MINUTES', c:'ac', gap:1},
    {at:2.5, kind:'stamp', t:'Acquired by Magento, 2016'},
  ]},
  // Chapter 02
  {k:16, n:4, th:'blue', trans:'wipe', els:[
    {at:0, kind:'label', t:'02  What I built'},
    {at:0, kind:'h1', t:'THEN I BUILT', sz:17},
    {at:0.5, kind:'h1', t:'MY OWN.', sz:17, c:'ac'},
    {at:2, kind:'sub', t:'Moved to New York. Started companies.'},
  ]},
  {k:20, n:4, th:'blue', trans:'cut', els:[
    {at:0, kind:'label', t:'02  What I built', keep:true},
    {at:0, kind:'item', t:'VOYAGER SCIENTIFIC', tag:'Data engineering'},
    {at:0.5, kind:'item', t:'AQUIFER', tag:'Two-way integration'},
    {at:1, kind:'item', t:'RESPONSEVAULT', tag:'Job site forms'},
  ]},
  // Chapter 03
  {k:24, n:4, th:'navy', trans:'wipe', els:[
    {at:0, kind:'label', t:'03  What I do now', barc:C.red},
    {at:0, kind:'h1', t:'TODAY I RUN'},
    {at:0.5, kind:'h1', t:'AUTOMATION TACTICS', c:'ac'},
    {at:1.75, kind:'sub', t:'AI adoption for operations teams.'},
  ]},
  {k:28, n:4, th:'navy', trans:'cut', els:[
    {at:0, kind:'label', t:'03  What I do now', barc:C.red, keep:true},
    {at:0, kind:'sub', t:'A recent proposal:'},
    {at:0.25, kind:'h1', t:'$405M BID', count:[0,405,v=>'$'+v+'M BID']},
    {at:1, kind:'h1', t:'10,000+ PAGES', count:[0,10000,v=>v.toLocaleString('en-US')+'+ PAGES']},
    {at:2, kind:'h2', t:'ONE AI AGENT ANSWERED THE RFP.', c:'ac'},
  ]},
  // The payoff
  {k:32, n:4, th:'white', trans:'wipe', els:[
    {at:0, kind:'words', sz:19, words:[{t:"DON'T", at:0}, {t:'DO', at:1}]},
    {at:0, kind:'words', sz:19, c:'ac', words:[{t:'ROBOT', at:2}, {t:'WORK.', at:3}]},
  ]},
  // End card over the break
  {k:36, n:7, th:'black', trans:'wipe', end:true, photo:{zoom:[1.1,1.0]}},
];

// ---------- helpers ----------
const $ = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); if (parent) parent.appendChild(e); return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = x => 1 - Math.pow(1 - clamp(x,0,1), 4);
const easeInOut = x => { x = clamp(x,0,1); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
function rnd(seed){ const s = Math.sin(seed*127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const scenesEl = document.getElementById('scenes');
const flash = document.getElementById('flash'), fade = document.getElementById('fade');
const grain = document.getElementById('grain'), prog = document.getElementById('prog'), urlEl = document.getElementById('url');

const GRAIN = [];
for (let g = 0; g < 6; g++){
  const cv = document.createElement('canvas'); cv.width = cv.height = 220;
  const cx = cv.getContext('2d'); const im = cx.createImageData(220,220);
  for (let i = 0; i < im.data.length; i += 4){ const v = rnd(i*0.37 + g*1000.3) * 255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  cx.putImageData(im,0,0); GRAIN.push(cv.toDataURL());
}
const DOTS = `radial-gradient(circle at 50% 50%, rgba(0,0,0,.9) 0 ${0.18*U}px, transparent ${0.34*U}px) 0 0/${0.8*U}px ${0.8*U}px`;
const IMG = {rj:'assets/img/report_builder.png'};

// type scale, in u
const SZ = {h1:14, h2:7.5, sub:4.3, label:2.4, item:10.5, tag:2.5, stamp:2.8};

// ---------- build ----------
function col(c, th){ return !c || c === 'fg' ? th.fg : c === 'ac' ? th.ac : c; }

function buildPhoto(sc, parent, endCard){
  const p = $('div', 'photo', parent); sc.photoEl = p;
  const im = $('img', null, p); im.src = 'assets/img/matt.jpg';
  im.style.objectPosition = WIDE ? '62% 38%' : PORTRAIT ? '58% 30%' : '56% 30%';
  sc.photoImg = im;
  $('div', 'tint', p, {background: C.blue});
  $('div', 'dots', p, {background: DOTS});
  $('div', null, p, {position:'absolute', inset:'0', background: WIDE
    ? 'linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 38%, rgba(0,0,0,0) 62%)'
    : 'linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.05) 38%, rgba(0,0,0,.85) 68%, #000 100%)'});
}

function build(sc, i){
  const th = TH[sc.th]; sc.th_ = th; sc.i = i;
  const el = $('div', 'scene on', scenesEl); sc.el = el;   // visible while building so it can be measured
  const push = $('div', 'push', el); sc.push = push;
  $('div', 'bg', push, {background: th.bg});
  if (sc.shot){
    const w = (WIDE ? 1.0 : 1.35) * W;
    const s = $('div', 'shot', push, {width:w+'px', marginLeft:(-w*0.42)+'px', marginTop:(-w*0.3)+'px', opacity:sc.shot.op});
    const im = $('img', null, s); im.src = IMG[sc.shot.src];
    im.style.filter = 'grayscale(1) invert(1) contrast(1.4) brightness(1.1)';
    sc.shotEl = s;
  }
  if (sc.photo) buildPhoto(sc, push, sc.end);
  if (sc.end){ buildEnd(sc, push, th); el.classList.remove('on'); return; }

  const maxW = (WIDE && sc.photo ? 0.5 : 1) * W - 2*PAD;
  const box = $('div', 'col', push, {left:PAD+'px', width:maxW+'px'});
  if (sc.place === 'bottom') box.style.bottom = (PAD + 4*U) + 'px';
  sc.box = box;
  sc.items = [];
  for (const e of sc.els){
    const it = {...e}; sc.items.push(it);
    const gap = (e.gap !== undefined ? e.gap : {label:3.4, h1:0, h2:0.8, sub:2.2, item:2.2, stamp:3, words:0, logo:3.4}[e.kind]) * U;
    if (e.kind === 'label'){
      const d = $('div', 'label', box, {fontSize:SZ.label*U+'px', color:th.fg, marginBottom:gap+'px'});
      $('span', 'bar', d, {width:(3.2*U)+'px', background: e.barc || (th.bg === C.blue ? C.white : C.blue)});
      it.txt = $('span', null, d); it.full = e.t.toUpperCase(); it.txt.textContent = it.full; it.el = d;
    } else if (e.kind === 'h1' || e.kind === 'h2'){
      const m = $('div', 'mask', box, {marginTop:gap+'px'});
      const d = $('div', e.kind + ' in', m, {fontSize:(e.sz || SZ[e.kind])*U+'px', color: e.dim ? th.dim : col(e.c, th), position:'relative'});
      d.textContent = e.t; it.el = d; it.mask = m;
      if (e.strike !== undefined){ it.strikeEl = $('div', 'strike', d, {background: th.fg}); }
    } else if (e.kind === 'words'){
      const d = $('div', 'h1', box, {fontSize:(e.sz || SZ.h1)*U+'px', color: col(e.c, th)});
      it.el = d;
      it.ws = e.words.map((w, j) => { const o = $('span', 'w', d); if (j) o.style.marginLeft = '.22em'; const s = $('span', null, o); s.textContent = w.t; return {...w, s}; });
    } else if (e.kind === 'sub'){
      const m = $('div', 'mask', box, {marginTop:gap+'px'});
      const d = $('div', 'sub in', m, {fontSize:SZ.sub*U+'px', color:th.fg, maxWidth:(maxW*0.95)+'px'});
      d.textContent = e.t; it.el = d; it.mask = m;
    } else if (e.kind === 'item'){
      const m = $('div', 'mask', box, {marginTop:gap+'px'});
      const d = $('div', 'item in', m);
      const n = $('span', 'h1', d, {fontSize:SZ.item*U+'px', color:th.fg}); n.textContent = e.t;
      const t = $('span', 'tag', d, {fontSize:SZ.tag*U+'px', color:th.fg, opacity:.8, marginTop:(0.6*U)+'px'}); t.textContent = e.tag;
      it.el = d; it.mask = m; it.nameEl = n; it.tagEl = t;
    } else if (e.kind === 'stamp'){
      const d = $('div', 'stamp', box, {fontSize:SZ.stamp*U+'px', marginTop:gap+'px', padding:`${0.9*U}px ${1.3*U}px`, background:th.fg, color:th.bg});
      d.textContent = e.t; it.el = d;
    } else if (e.kind === 'logo'){
      const d = $('img', null, box, {width:Math.min(maxW*0.7, 62*U)+'px', marginTop:gap+'px'}); d.src = 'assets/img/at-logo-white.png';
      it.el = d;
    }
  }
  // fit: shrink big type that would run past the right margin, then center the column vertically
  for (const it of sc.items){
    const tgt = it.kind === 'item' ? it.nameEl : (it.kind === 'h1' || it.kind === 'h2' || it.kind === 'words') ? it.el : null;
    if (!tgt) continue;
    const w = tgt.scrollWidth;
    if (w > maxW){
      const fixed = 0;
      const node = it.kind === 'item' ? it.nameEl : tgt;
      const f = (maxW - fixed) / (w - fixed);
      node.style.fontSize = (parseFloat(getComputedStyle(node).fontSize) * f) + 'px';
    }
  }
  if (sc.place !== 'bottom'){ const h = box.getBoundingClientRect().height; box.style.top = ((H - h)/2 - 1*U) + 'px'; }
  el.classList.remove('on');
}

function buildEnd(sc, parent, th){
  const box = $('div', 'col', parent, {left:PAD+'px', bottom:(PAD + 3*U)+'px'});
  sc.endEls = [];
  const tag = $('div', 'label', box, {fontSize:SZ.label*U+'px', color:C.white, marginBottom:(2.6*U)+'px'});
  $('span', 'bar', tag, {width:(3.2*U)+'px', background:C.red});
  $('span', null, tag).textContent = '#NOROBOTWORK';
  sc.endEls.push({el:tag, at:0, kind:'label'});
  ['MATT','MONIHAN'].forEach((n, i) => {
    const m = $('div', 'mask', box); const d = $('div', 'h1 in', m, {fontSize:(WIDE ? 15 : 16)*U+'px', color:C.white}); d.textContent = n;
    sc.endEls.push({el:d, at:0.25 + i*0.5, kind:'h1'});
  });
  const info = [
    {t:'Automation Tactics · AI adoption', big:false, at:1.5},
    {t:'MATTMONIHAN.COM', big:true, at:2},
    {t:'linkedin.com/in/mattmonihan', big:false, at:2.5},
  ];
  info.forEach(i => {
    const m = $('div', 'mask', box, {marginTop:(1.6*U)+'px'});
    const d = $('div', 'in', m, i.big
      ? {fontFamily:'Mono', fontWeight:800, letterSpacing:'.06em', fontSize:(3.6*U)+'px', background:C.white, color:C.blue, padding:`${0.5*U}px ${1*U}px`, display:'inline-block'}
      : {fontFamily:'Mono', fontWeight:800, letterSpacing:'.06em', textTransform:'uppercase', fontSize:(2.4*U)+'px', color:C.white});
    d.textContent = i.t; sc.endEls.push({el:d, at:i.at, kind:'line'});
  });
}

// ---------- per-frame render ----------
function sceneAt(beatF){ let a = 0; SCENES.forEach((s, i) => { if (beatF >= s.k) a = i; }); return a; }
const REVEAL = 0.4;   // seconds for a line to rise into place
const WIPE = 0.34;    // seconds for a chapter wipe

function revealT(tc, atBeat){ return (tc - atBeat*P) / REVEAL; }

function renderScene(sc, tc, t){
  const span = sc.n * P;
  sc.push.style.transform = `scale(${1 + 0.03 * clamp(tc/span, 0, 1)})`;
  if (sc.photoImg){ const z = sc.photo.zoom; sc.photoImg.style.transform = `scale(${z[0] + (z[1]-z[0])*clamp(tc/span,0,1)})`; }
  if (sc.shotEl){ const base = sc.shot.cont ? P*4 : 0; sc.shotEl.style.transform = `rotate(${sc.shot.rot}deg) translateX(${-(tc+base)*2*U}px)`; }
  if (sc.end){
    sc.endEls.forEach(e => { const r = easeOut(revealT(tc, e.at));
      if (e.kind === 'label'){ e.el.style.opacity = r; e.el.style.transform = `translateX(${(1-r)*-4*U}px)`; }
      else { e.el.style.transform = `translateY(${(1-r)*110}%)`; } });
    return;
  }
  for (const it of sc.items){
    const r = it.keep ? 1 : easeOut(revealT(tc, it.at));
    switch (it.kind){
      case 'label': {
        const n = it.keep ? it.full.length : Math.floor(clamp(revealT(tc, it.at)*1.4, 0, 1) * it.full.length);
        it.txt.textContent = it.full.slice(0, n); it.el.style.opacity = it.keep || tc >= it.at*P ? 1 : 0; break; }
      case 'h1': case 'h2': case 'sub': case 'item':
        it.el.style.transform = `translateY(${(1-r)*112}%)`;
        if (it.count){ const [a,b,f] = it.count; const v = Math.round(a + (b-a)*easeOut((tc - it.at*P)/0.55)); it.el.textContent = f(v); }
        if (it.strikeEl){ it.strikeEl.style.width = (104*easeOut((tc - it.strike*P)/0.25)) + '%'; }
        break;
      case 'words':
        it.ws.forEach(w => { const rw = easeOut(revealT(tc, w.at)); w.s.style.transform = `translateY(${(1-rw)*112}%)`; });
        break;
      case 'stamp': case 'logo':
        it.el.style.opacity = clamp(revealT(tc, it.at)*2.5, 0, 1);
        it.el.style.transform = `translateY(${(1-r)*2*U}px)`;
        break;
    }
  }
}

let shown = [];
function render(t){
  t = clamp(t, 0, DUR - 1e-6);
  const beatF = t / P;
  const i = sceneAt(beatF), sc = SCENES[i];
  const tc = t - sc.k * P;

  // which scenes are on screen: the current one, plus the previous one during a wipe
  const wiping = sc.trans === 'wipe' && i > 0 && tc < WIPE;
  const on = wiping ? [SCENES[i-1], sc] : [sc];
  shown.forEach(s => { if (!on.includes(s)) s.el.classList.remove('on'); });
  on.forEach(s => s.el.classList.add('on'));
  shown = on;

  if (wiping){
    const prev = SCENES[i-1];
    renderScene(prev, t - prev.k*P, t);
    const x = 100 * (1 - easeInOut(tc / WIPE));
    sc.el.style.clipPath = `inset(0 0 0 ${x}%)`;
  } else sc.el.style.clipPath = 'none';
  sc.el.style.zIndex = 2;
  if (wiping) SCENES[i-1].el.style.zIndex = 1;
  renderScene(sc, tc, t);

  // the pickup ends on the song's gap: fade to black just before the drop
  const fo = sc.fadeOut ? clamp((tc - (sc.n*P - sc.fadeOut)) / sc.fadeOut, 0, 1) : 0;

  // one soft flash, on the drop only
  let fl = 0;
  if (sc.flash && tc < 0.3) fl = 0.7 * (1 - easeOut(tc / 0.3));
  flash.style.background = sc.flash || C.white; flash.style.opacity = fl;

  grain.style.backgroundImage = `url(${GRAIN[Math.floor(t*15) % GRAIN.length]})`;
  const fg = sc.th_.fg;
  urlEl.style.color = fg; urlEl.style.opacity = sc.end ? 0 : 0.55;
  prog.style.width = (100 * t / DUR) + '%'; prog.style.background = sc.end ? C.blue : fg; prog.style.opacity = 0.6;

  fade.style.opacity = Math.max(fo, clamp((t - (DUR - 0.4)) / 0.38, 0, 1));
}

window.ready = (async () => {
  await document.fonts.load("100px 'Bebas'"); await document.fonts.load("800 20px 'Mono'"); await document.fonts.load("500 20px 'Mono'"); await document.fonts.load("600 20px 'Inter'");
  await document.fonts.ready;
  Object.assign(urlEl.style, {left:PAD+'px', bottom:(3.4*U)+'px', fontSize:(1.9*U)+'px'});
  urlEl.textContent = 'MATTMONIHAN.COM';
  prog.style.height = (0.4*U) + 'px';
  SCENES.forEach(build);
  await Promise.all([...document.images].map(i => i.decode().catch(() => null)));
  render(+q.get('t') || 0);
  return {W, H, DUR, fonts: document.fonts.check("100px 'Bebas'")};
})();
</script>
